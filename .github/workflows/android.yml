# LockRoot — Android CI
# Compila o APK debug a cada push na main, PR e manualmente.
# Não usa o Gradle Wrapper: o repo não tem gradlew nem gradle-wrapper.jar
# (como no AOTV, o jar fica fora do repo). O Gradle 8.13 é instalado
# pela action gradle/actions/setup-gradle, na versão do wrapper properties.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NÃO usar android-actions/setup-android: a v3 tenta instalar o
      # pacote obsoleto 'tools' e falha (run #1: sdkmanager exit code 1).
      # O runner ubuntu-latest já traz o Android SDK pré-instalado; basta
      # instalar a plataforma 36 com o sdkmanager que já está lá.
      - name: Install Android 36 platform and build-tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lockroot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
